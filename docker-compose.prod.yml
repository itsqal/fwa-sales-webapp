# Production stack for the dashboard, on the same Ubuntu box as the API.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Two deliberate choices, both explained at length in DEPLOYMENT.md §5:
#
#   * Nothing binds to a public interface. The dashboard publishes on 127.0.0.1
#     only and the internet reaches it through nginx, which terminates TLS.
#   * It joins the API's existing Docker network instead of calling the public
#     domain. Requests to the API then never leave the machine — no DNS, no TLS
#     handshake, no round trip through nginx to reach a neighbour.

services:
  web:
    build: .
    container_name: fwa_dashboard
    restart: unless-stopped
    env_file: .env
    ports:
      # nginx proxies to this. Never publish 0.0.0.0 — the login cookie is
      # `Secure`, so TLS has to terminate in front of it.
      - "127.0.0.1:3000:3000"
    networks:
      - api
    healthcheck:
      # The dashboard's own liveness, not the API's. See src/app/api/health.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  api:
    # The network the API stack already created. Compose names it after the
    # backend's project directory — usually `backend_default`. Confirm with
    # `docker network ls` and set BACKEND_NETWORK in .env; this fails loudly
    # rather than silently starting an isolated dashboard that cannot log in.
    external: true
    name: ${BACKEND_NETWORK:?set BACKEND_NETWORK in .env - find it with "docker network ls"}
